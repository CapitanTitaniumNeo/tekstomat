<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Бърз Експорт | Буфер към .TXT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: rgb(9, 13, 22);
            --card-bg: rgba(22, 31, 48, 0.78);
            --card-border: rgba(255, 255, 255, 0.12);
            --emerald: rgb(16, 185, 129);
            --emerald-glow: rgba(16, 185, 129, 0.35);
            --gold: rgb(245, 158, 11);
            --gold-glow: rgba(245, 158, 11, 0.35);
            --danger: rgb(239, 68, 68);
            --text-main: rgb(248, 250, 252);
            --text-muted: rgb(148, 163, 184);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.12) 0%, transparent 45%);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px 14px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 26px 22px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .container.success-state {
            border-color: var(--gold);
            box-shadow: 0 20px 50px -10px var(--gold-glow);
        }

        /* Заглавна част */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.14);
            color: var(--emerald);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.4px;
            margin-bottom: 10px;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: var(--emerald);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--emerald);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, rgb(255, 255, 255) 0%, rgb(203, 213, 225) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* 3 лесни стъпки за потребителите */
        .steps {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
            background: rgba(15, 23, 42, 0.6);
            padding: 12px 10px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .step-item {
            text-align: center;
            font-size: 11.5px;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .step-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            background: rgba(16, 185, 129, 0.2);
            color: var(--emerald);
            font-weight: 700;
            border-radius: 50%;
            margin-bottom: 5px;
            font-size: 12px;
        }

        /* Главен бутон за експорт */
        .btn-primary {
            position: relative;
            width: 100%;
            background: linear-gradient(135deg, rgb(16, 185, 129) 0%, rgb(5, 150, 105) 100%);
            color: rgb(255, 255, 255);
            border: none;
            border-radius: 18px;
            padding: 20px 18px;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 25px -5px var(--emerald-glow);
            transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.3s ease;
            margin-bottom: 16px;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-primary.downloaded {
            background: linear-gradient(135deg, rgb(245, 158, 11) 0%, rgb(217, 119, 6) 100%);
            box-shadow: 0 10px 25px -5px var(--gold-glow);
        }

        /* Живо име на файла */
        .file-preview-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 12.5px;
        }

        .file-label {
            color: var(--text-muted);
        }

        .file-name-live {
            font-family: 'JetBrains Mono', monospace;
            color: var(--emerald);
            font-weight: 600;
            font-size: 12.5px;
        }

        /* Статистика на текста */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 10px 8px;
            text-align: center;
        }

        .stat-val {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-lbl {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Текстово поле за директно поставяне */
        .editor-wrap {
            position: relative;
            margin-bottom: 14px;
        }

        textarea {
            width: 100%;
            height: 125px;
            background: rgba(9, 13, 22, 0.85);
            color: var(--text-main);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 14px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            transition: border-color 0.2s ease;
        }

        textarea::placeholder {
            color: rgb(100, 116, 139);
        }

        textarea:focus {
            outline: none;
            border-color: var(--emerald);
        }

        /* Вторични бутони (Изчисти / Свали пак) */
        .actions-row {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            flex: 1;
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 11px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-clear {
            color: rgb(252, 165, 165);
        }

        /* Статус съобщение */
        .status-banner {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 600;
            text-align: center;
        }

        .status-banner.show {
            display: block;
        }

        /* Списък с последно свалени файлове */
        .history {
            margin-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 14px;
            display: none;
        }

        .history-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.5);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 6px;
            font-family: 'JetBrains Mono', monospace;
        }

        .history-meta {
            color: var(--emerald);
        }
    </style>
</head>
<body>

    <div class="container" id="appCard">
        <div class="header">
            <div class="badge">
                <span class="badge-dot"></span>
                АВТОМАТИЧЕН ЕКСПОРТ В .TXT
            </div>
            <h1>Буфер към Файл</h1>
            <p class="subtitle">Превърнете копирания текст в готов .txt документ с едно докосване</p>
        </div>

        <div class="steps">
            <div class="step-item">
                <div class="step-num">1</div>
                <div>Копирайте желания текст</div>
            </div>
            <div class="step-item">
                <div class="step-num">2</div>
                <div>Натиснете зеления бутон</div>
            </div>
            <div class="step-item">
                <div class="step-num">3</div>
                <div>Файлът е в „Изтеглени"</div>
            </div>
        </div>

        <button class="btn-primary" id="mainBtn" onclick="handleSmartExport()">
            <span id="btnIcon">📥</span>
            <span id="btnText">ЗАПИШИ БУФЕРА В .TXT ФАЙЛ</span>
        </button>

        <div class="file-preview-bar">
            <span class="file-label">Име на файла:</span>
            <span class="file-name-live" id="liveFileName">2026-10-28_09_35_00.txt</span>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-val" id="charStat">0</div>
                <div class="stat-lbl">Символи</div>
            </div>
            <div class="stat-box">
                <div class="stat-val" id="lineStat">0</div>
                <div class="stat-lbl">Редове</div>
            </div>
            <div class="stat-box">
                <div class="stat-val" id="wordStat">0</div>
                <div class="stat-lbl">Думи</div>
            </div>
        </div>

        <div class="editor-wrap">
            <textarea id="textInput" placeholder="Или докоснете тук и натиснете „Постави" (Paste) от клавиатурата – файлът ще се изтегли автоматично на секундата!"></textarea>
        </div>

        <div class="actions-row">
            <button class="btn-secondary" onclick="manualDownload()">💾 Свали текста от полето</button>
            <button class="btn-secondary btn-clear" onclick="clearAll()">🗑️ Изчисти</button>
        </div>

        <div class="status-banner" id="statusBanner"></div>

        <div class="history" id="historyBox">
            <div class="history-title">Последно записани файлове:</div>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        function pad(n) {
            return n < 10 ? '0' + n : String(n);
        }

        function getFormattedFileName() {
            var d = new Date();
            return d.getFullYear() + '-' +
                   pad(d.getMonth() + 1) + '-' +
                   pad(d.getDate()) + '_' +
                   pad(d.getHours()) + '_' +
                   pad(d.getMinutes()) + '_' +
                   pad(d.getSeconds()) + '.txt';
        }

        function updateLiveClock() {
            document.getElementById('liveFileName').innerText = getFormattedFileName();
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        function updateStats(text) {
            var clean = text || '';
            var chars = clean.length;
            var lines = chars > 0 ? clean.split(/\r\n|\r|\n/).length : 0;
            var words = chars > 0 ? clean.trim().split(/\s+/).filter(Boolean).length : 0;

            document.getElementById('charStat').innerText = chars.toLocaleString('bg-BG');
            document.getElementById('lineStat').innerText = lines.toLocaleString('bg-BG');
            document.getElementById('wordStat').innerText = words.toLocaleString('bg-BG');
        }

        function showStatus(msg, bgColor, textColor) {
            var banner = document.getElementById('statusBanner');
            banner.style.backgroundColor = bgColor;
            banner.style.color = textColor;
            banner.innerText = msg;
            banner.classList.add('show');
        }

        function addHistoryItem(fileName, charCount) {
            var box = document.getElementById('historyBox');
            var list = document.getElementById('historyList');
            box.style.display = 'block';

            var item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = '<span>📄 ' + fileName + '</span><span class="history-meta">' + charCount.toLocaleString('bg-BG') + ' симв.</span>';
            list.insertBefore(item, list.firstChild);
        }

        function triggerTxtDownload(content) {
            if (!content || content.length === 0) return;

            var fileName = getFormattedFileName();
            var blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();

            setTimeout(function() {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 600);

            if (navigator.vibrate) {
                navigator.vibrate([120, 40, 160]);
            }

            updateStats(content);

            var card = document.getElementById('appCard');
            var btn = document.getElementById('mainBtn');
            var btnIcon = document.getElementById('btnIcon');
            var btnText = document.getElementById('btnText');

            card.classList.add('success-state');
            btn.classList.add('downloaded');
            btnIcon.innerText = '✅';
            btnText.innerText = 'СВАЛЕН: ' + fileName;

            showStatus(
                '✅ Файлът ' + fileName + ' (' + content.length.toLocaleString('bg-BG') + ' символа) е записан в папка „Изтеглени"!',
                'rgba(16, 185, 129, 0.18)',
                'rgb(110, 231, 183)'
            );

            addHistoryItem(fileName, content.length);

            setTimeout(function() {
                card.classList.remove('success-state');
                btn.classList.remove('downloaded');
                btnIcon.innerText = '📥';
                btnText.innerText = 'ЗАПИШИ БУФЕРА В .TXT ФАЙЛ';
            }, 4000);
        }

        function handleSmartExport() {
            var input = document.getElementById('textInput');

            if (navigator.clipboard && navigator.clipboard.readText) {
                navigator.clipboard.readText().then(function(clipText) {
                    if (clipText && clipText.length > 0) {
                        input.value = clipText;
                        triggerTxtDownload(clipText);
                    } else if (input.value && input.value.length > 0) {
                        triggerTxtDownload(input.value);
                    } else {
                        showStatus(
                            '⚠️ Буферът в момента е празен! Копирайте текст или го поставете директно в полето по-долу.',
                            'rgba(239, 68, 68, 0.2)',
                            'rgb(252, 165, 165)'
                        );
                        input.focus();
                    }
                }).catch(function() {
                    if (input.value && input.value.length > 0) {
                        triggerTxtDownload(input.value);
                    } else {
                        showStatus(
                            '👆 Докоснете текстовото поле по-долу и натиснете „Постави" (Paste) – файлът ще се свали веднага!',
                            'rgba(245, 158, 11, 0.2)',
                            'rgb(253, 224, 71)'
                        );
                        input.focus();
                    }
                });
            } else {
                if (input.value && input.value.length > 0) {
                    triggerTxtDownload(input.value);
                } else {
                    showStatus(
                        '👆 Поставете текста в полето по-долу за автоматично изтегляне!',
                        'rgba(245, 158, 11, 0.2)',
                        'rgb(253, 224, 71)'
                    );
                    input.focus();
                }
            }
        }

        function manualDownload() {
            var val = document.getElementById('textInput').value;
            if (val && val.length > 0) {
                triggerTxtDownload(val);
            } else {
                showStatus(
                    '⚠️ Полето е празно! Първо поставете текст вътре.',
                    'rgba(239, 68, 68, 0.2)',
                    'rgb(252, 165, 165)'
                );
                document.getElementById('textInput').focus();
            }
        }

        function clearAll() {
            var input = document.getElementById('textInput');
            input.value = '';
            updateStats('');
            document.getElementById('statusBanner').classList.remove('show');
        }

        /* Автоматично сваляне веднага при поставяне (Paste) в текстовото поле */
        document.getElementById('textInput').addEventListener('paste', function() {
            var self = this;
            setTimeout(function() {
                if (self.value && self.value.length > 0) {
                    triggerTxtDownload(self.value);
                }
            }, 80);
        });

        document.getElementById('textInput').addEventListener('input', function() {
            updateStats(this.value);
        });
    </script>
</body>
</html>
